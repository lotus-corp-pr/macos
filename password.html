<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contraseña del día</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f0f0f0;
    }
    .password-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: inline-block;
    }
    .password {
      font-size: 24px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="password-container">
    <h1>Contraseña del día</h1>
    <p>Fecha: <span id="date"></span></p>
    <p>Contraseña: <span id="password" class="password"></span></p>
  </div>

  <script>
    // Lista de contraseñas en orden
    const passwords = ["100910", "336699", "oak", "lotusgames", "1234", "pr", "gl"];

    // Obtener el día actual para calcular el índice
    const today = new Date();
    const startDate = new Date("2026-08-18"); // Fecha de inicio (hoy)
    const diffTime = Math.abs(today - startDate);
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    // Calcular el índice de la contraseña (se repite cada 7 días)
    const passwordIndex = diffDays % passwords.length;
    const password = passwords[passwordIndex];

    // Mostrar la fecha y la contraseña
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();
    const dateStr = `${day}-${month}-${year}`;

    document.getElementById('date').textContent = dateStr;
    document.getElementById('password').textContent = password;
  </script>
</body>
</html>
