<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contraseña del día</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f0f0f0;
    }
    .password-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: inline-block;
    }
    .password {
      font-size: 24px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="password-container">
    <h1>Contraseña del día</h1>
    <p>Fecha: <span id="date"></span></p>
    <p>Contraseña: <span id="password" class="password"></span></p>
  </div>

  <script>
    // Obtener la fecha actual en formato DD-MM-YYYY
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();
    const dateStr = `${day}-${month}-${year}`;

    // Generar la contraseña (ej: "macOS-18-08-2026")
    const password = `macOS-${dateStr}`;

    // Mostrar la fecha y la contraseña
    document.getElementById('date').textContent = dateStr;
    document.getElementById('password').textContent = password;
  </script>
</body>
</html>
